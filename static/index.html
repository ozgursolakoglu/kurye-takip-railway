<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurye Takip</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2938;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}#liveAlerts{position:sticky;top:0;z-index:10;background:#fff5d8;color:#654700;border-bottom:1px solid #e8d292;padding:12px 4%;font-weight:600}#liveAlerts:empty{display:none}header{background:#15385c;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}main{max-width:1160px;margin:28px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 24px #1b385c12}input,select,button{font:inherit;border:1px solid #c7d1dc;border-radius:8px;padding:11px;margin:5px 4px 5px 0}button{background:#1761a2;color:white;border:0;cursor:pointer}button:hover{background:#104c81}button.danger{background:#ad3340}button.secondary{background:#536778}button:disabled{opacity:.5;cursor:default}label{display:inline-flex;flex-direction:column;gap:3px;margin-right:10px}table{width:100%;border-collapse:collapse;min-width:800px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e7ee}th{background:#edf3f9}.scroll{overflow:auto}.muted{color:#60758c}.pill{border-radius:12px;padding:4px 10px;background:#e9f0f8;white-space:nowrap}.hidden{display:none!important}#message{padding:12px;border-radius:8px;background:#eaf4fd;margin:12px 0;white-space:pre-wrap}#message:empty{display:none}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}nav button{background:#375c7d}small{color:#64788b}
.pendingBadge{display:inline-block;background:#fff2bc;color:#6b4700;border-radius:20px;padding:8px 12px;font-weight:700}.pendingBadge.hidden{display:none}#soundToggle{white-space:nowrap}header{flex-wrap:wrap;gap:10px}</style></head><body><header><h1>🛵 Kurye Takip</h1><div id="identity"></div><span id="pendingBadge" class="pendingBadge hidden" aria-live="polite">🔔 0 bekleyen</span><button id="soundToggle" type="button" class="secondary hidden" aria-pressed="false">🔇 Ses kapalı</button></header><div id="liveAlerts" role="status" aria-live="polite"></div><main><div id="message" role="status"></div>
<section id="loginCard" class="card"><h2>Giriş Yap</h2><p class="muted">E-posta veya kayıtlı telefon numaranızla giriş yapın.</p><form id="loginForm"><label>E-posta / Telefon<input id="identifier" required autocomplete="username" placeholder="+905xxxxxxxxx"></label><label>Şifre<input id="password" required type="password" autocomplete="current-password"></label><button>Giriş Yap</button></form></section>
<div id="workspace" class="hidden"><nav class="row"><button onclick="showTab('receipts')">Fişler</button><button onclick="showTab('report')">Raporlar</button><button id="usersTab" class="hidden" onclick="showTab('users')">Kullanıcılar</button><button class="secondary" onclick="logout()">Çıkış</button></nav>
<section id="receipts" class="card"><h2>Fişler</h2><form id="receiptForm" class="row"><label>Fiş numarası<input id="receiptNo" required></label><label>Fiş tarihi<input id="receiptDate" type="date" required></label><label>Ödeme yöntemi<select id="payment"><option value="cash">Nakit</option><option value="card">Kart</option><option value="meal">Yemek çeki</option><option value="iban">IBAN</option></select></label><button>Fişi Kaydet</button></form><div class="scroll"><table><thead><tr><th>Fiş</th><th>Tarih</th><th>Kurye</th><th>Ödeme</th><th>Durum</th><th>Onaylayan</th><th>İptal eden</th><th>İşlem</th></tr></thead><tbody id="receiptRows"></tbody></table></div></section>
<section id="report" class="card hidden"><h2>Raporlar</h2><div class="row"><label>Başlangıç<input type="date" id="fromDate"></label><label>Bitiş<input type="date" id="toDate"></label><label>Kurye<select id="courierFilter"><option value="">Tüm kuryeler</option></select></label><button onclick="renderReport()">Filtrele</button><button class="secondary" onclick="exportCsv()">CSV İndir</button><button class="secondary" onclick="exportExcel()">Excel (.xlsx) İndir</button></div><div id="summary"></div><div class="row" role="tablist" aria-label="Rapor türü"><button type="button" id="courierReportTab" role="tab" aria-selected="true" onclick="setReportView('courier')">Kurye Bazında</button><button type="button" id="paymentReportTab" role="tab" aria-selected="false" onclick="setReportView('payment')">Ödeme Yöntemine Göre</button></div><div id="courierReport" class="scroll"><table><thead><tr><th>Kurye</th><th>Toplam</th><th>Onaylı</th><th>Bekleyen</th><th>İptal</th></tr></thead><tbody id="reportRows"></tbody></table></div><div id="paymentReport" class="scroll hidden"><table><thead><tr><th>Ödeme Yöntemi</th><th>Toplam Fiş</th><th>Onaylı</th><th>Bekleyen</th><th>İptal</th></tr></thead><tbody id="paymentReportRows"></tbody></table></div></section>
<section id="users" class="card hidden"><h2>Kullanıcı Yönetimi</h2><form id="userForm" class="row"><label>Ad soyad<input id="newName" required></label><label>E-posta<input id="newEmail" type="email"></label><label>Telefon (+90...)<input id="newPhone" placeholder="+905xxxxxxxxx"></label><label>Şifre (en az 12 karakter)<input id="newPassword" type="password" minlength="12" required></label><label>Rol<select id="newRole"><option value="courier">Kurye</option><option value="manager">Yönetici</option></select></label><button>Kullanıcı Ekle</button></form><div class="scroll"><table><thead><tr><th>İsim</th><th>Rol</th><th>E-posta</th><th>Telefon</th><th>Aktif</th></tr></thead><tbody id="userRows"></tbody></table></div></section></div></main>
<script>
let token=sessionStorage.getItem('kurye_token')||'',me=null,receipts=[],users=[];let pollBusy=false,seenReceiptState=null,alertTimer=null;let soundEnabled=false,audioCtx=null;
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pay={cash:'Nakit',card:'Kart',meal:'Yemek çeki',iban:'IBAN'},status={pending:'Bekliyor',approved:'Onaylandı',cancelled:'İptal'};
function notice(s){$('message').textContent=s;window.scrollTo({top:0,behavior:'smooth'})}
async function api(path,options={}){const res=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...options.headers}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'İşlem başarısız');return data}
function showTab(id){for(const key of ['receipts','report','users'])$(key).classList.toggle('hidden',key!==id);if(id==='report')renderReport()}
function logout(){soundEnabled=false;$('soundToggle').classList.add('hidden');$('pendingBadge').classList.add('hidden');seenReceiptState=null;$('liveAlerts').textContent='';token='';me=null;sessionStorage.removeItem('kurye_token');$('workspace').classList.add('hidden');$('loginCard').classList.remove('hidden');$('identity').textContent=''}
async function init(){if(!token)return;try{me=await api('/me');$('loginCard').classList.add('hidden');$('workspace').classList.remove('hidden');$('identity').textContent=me.full_name+' ('+(me.role==='manager'?'Yönetici':'Kurye')+')';const isManager=me.role==='manager';$('soundToggle').classList.toggle('hidden',!isManager);$('usersTab').classList.toggle('hidden',!isManager);$('receiptForm').classList.toggle('hidden',isManager);await refresh();seenReceiptState=new Map(receipts.map(r=>[r.id,r.status]));}catch(e){logout();notice(e.message)}}
async function refresh(){receipts=await api('/receipts');if(me.role==='manager')users=await api('/users');seenReceiptState=new Map(receipts.map(r=>[r.id,r.status]));renderReceipts();renderUsers();renderReport();updatePendingBadge()}
function updatePendingBadge(){const el=$('pendingBadge');if(!me||me.role!=='manager'){el.classList.add('hidden');return}const count=receipts.filter(r=>r.status==='pending').length;el.textContent='🔔 '+count+' bekleyen';el.classList.remove('hidden')}
function playAlertSound(){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;[0,0.18].forEach((offset)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(0.0001,now+offset);gain.gain.exponentialRampToValueAtTime(0.13,now+offset+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.15);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+offset);osc.stop(now+offset+0.16)})}catch(e){console.warn('Bildirim sesi çalınamadı',e)}}
$('soundToggle').addEventListener('click',async()=>{soundEnabled=!soundEnabled;if(soundEnabled){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume()}catch(e){soundEnabled=false;notice('Tarayıcı ses açılmasına izin vermedi')}}$('soundToggle').textContent=soundEnabled?'🔊 Ses açık':'🔇 Ses kapalı';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled))});
function liveNotice(text){$('liveAlerts').textContent=text;clearTimeout(alertTimer);alertTimer=setTimeout(()=>$('liveAlerts').textContent='',12000)}
async function pollUpdates(){if(!token||!me||pollBusy||document.visibilityState==='hidden')return;pollBusy=true;try{const fresh=await api('/receipts');if(seenReceiptState){const newlyPending=fresh.filter(r=>!seenReceiptState.has(r.id)&&r.status==='pending');const changed=fresh.filter(r=>seenReceiptState.has(r.id)&&seenReceiptState.get(r.id)!==r.status);if(me.role==='manager'&&newlyPending.length){liveNotice('🔔 '+newlyPending.length+' yeni fiş onay bekliyor.');playAlertSound()}else if(changed.length)liveNotice('🔔 '+changed.length+' fişin durumu güncellendi.');}receipts=fresh;seenReceiptState=new Map(fresh.map(r=>[r.id,r.status]));renderReceipts();renderReport();updatePendingBadge();}catch(e){if(e.message==='Session expired'||e.message==='Authentication required'){logout();notice('Oturum süresi doldu, tekrar giriş yapın.')}}finally{pollBusy=false}}
setInterval(pollUpdates,10000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pollUpdates()});
function renderReceipts(){$('receiptRows').innerHTML=receipts.map(r=>'<tr><td>'+escapeHtml(r.receipt_number)+'</td><td>'+escapeHtml(r.receipt_date)+'</td><td>'+escapeHtml(r.courier_name)+'</td><td>'+pay[r.payment_method]+'</td><td><span class="pill">'+status[r.status]+'</span></td><td>'+escapeHtml(r.approved_by||'—')+'</td><td>'+escapeHtml(r.cancelled_by||'—')+'</td><td>'+(me.role==='manager'?(r.status==='pending'?'<button data-action="approve" data-id="'+r.id+'">Onayla</button>':r.status==='approved'?'<button class="danger" data-action="cancel" data-id="'+r.id+'">İptal</button>':'<button data-action="reactivate" data-id="'+r.id+'">Yeniden Aç</button>'):'')+'<button class="secondary" data-action="history" data-id="'+r.id+'">Geçmiş</button></td></tr>').join('')||'<tr><td colspan="8">Henüz fiş yok</td></tr>'}
function renderUsers(){if(me.role!=='manager')return;$('userRows').innerHTML=users.map(u=>'<tr><td>'+escapeHtml(u.name)+'</td><td>'+escapeHtml(u.role)+'</td><td>'+escapeHtml(u.email)+'</td><td>'+escapeHtml(u.phone)+'</td><td>'+(u.active?'Evet':'Hayır')+'</td></tr>').join('');const chosen=$('courierFilter').value;$('courierFilter').innerHTML='<option value="">Tüm kuryeler</option>'+users.filter(u=>u.role==='courier').map(u=>'<option value="'+u.id+'">'+escapeHtml(u.name)+'</option>').join('');$('courierFilter').value=chosen}
function filtered(){const f=$('fromDate').value,t=$('toDate').value,c=$('courierFilter').value;return receipts.filter(r=>(!f||r.receipt_date>=f)&&(!t||r.receipt_date<=t)&&(!c||r.courier_id===c))}
let reportView="courier";function setReportView(view){reportView=view;const payment=view==="payment";$("courierReport").classList.toggle("hidden",payment);$("paymentReport").classList.toggle("hidden",!payment);$("courierReportTab").setAttribute("aria-selected",String(!payment));$("paymentReportTab").setAttribute("aria-selected",String(payment));renderReport()}
function renderReport(){if(!me)return;const list=filtered(),map=new Map();for(const r of list){let x=map.get(r.courier_id)||{name:r.courier_name,total:0,approved:0,pending:0,cancelled:0};x.total++;x[r.status]++;map.set(r.courier_id,x)}$('summary').textContent='Toplam fiş: '+list.length+' | Onaylanan: '+list.filter(x=>x.status==='approved').length+' | Bekleyen: '+list.filter(x=>x.status==='pending').length+' | İptal: '+list.filter(x=>x.status==='cancelled').length;$('reportRows').innerHTML=[...map.values()].map(x=>'<tr><td>'+escapeHtml(x.name)+'</td><td>'+x.total+'</td><td>'+x.approved+'</td><td>'+x.pending+'</td><td>'+x.cancelled+'</td></tr>').join('');const methods=[['cash','Nakit'],['card','Kredi/Banka Kartı'],['meal','Yemek Çeki'],['iban','IBAN']];$('paymentReportRows').innerHTML=methods.map(([key,label])=>{const items=list.filter(r=>r.payment_method===key);return '<tr><td>'+label+'</td><td>'+items.length+'</td><td>'+items.filter(r=>r.status==='approved').length+'</td><td>'+items.filter(r=>r.status==='pending').length+'</td><td>'+items.filter(r=>r.status==='cancelled').length+'</td></tr>'}).join('')}
async function exportExcel(){try{const params=new URLSearchParams();if($('fromDate').value)params.set('from',$('fromDate').value);if($('toDate').value)params.set('to',$('toDate').value);if($('courierFilter').value)params.set('courier_id',$('courierFilter').value);const res=await fetch('/api/export.xlsx?'+params,{headers:{Authorization:'Bearer '+token}});if(!res.ok)throw Error('Excel raporu oluşturulamadı');const blob=await res.blob();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='kurye-rapor.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){notice(e.message)}}
function exportCsv(){const rows=[['Fiş','Tarih','Kurye','Ödeme','Durum','Onaylayan','İptal Eden'],...filtered().map(r=>[r.receipt_number,r.receipt_date,r.courier_name,pay[r.payment_method],status[r.status],r.approved_by||'',r.cancelled_by||''])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='kurye-rapor.csv';a.click();URL.revokeObjectURL(a.href)}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const data=await api('/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});token=data.token;sessionStorage.setItem('kurye_token',token);$('password').value='';notice('Giriş başarılı');await init()}catch(e){notice(e.message)}};
$('receiptForm').onsubmit=async e=>{e.preventDefault();try{await api('/receipts',{method:'POST',body:JSON.stringify({receipt_number:$('receiptNo').value,receipt_date:$('receiptDate').value,payment_method:$('payment').value})});$('receiptNo').value='';notice('Fiş kaydedildi');await refresh()}catch(e){notice(e.message)}};
$('userForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify({full_name:$('newName').value,email:$('newEmail').value||null,phone_e164:$('newPhone').value||null,password:$('newPassword').value,role:$('newRole').value})});$('userForm').reset();notice('Kullanıcı oluşturuldu');await refresh()}catch(e){notice(e.message)}};
$('receiptRows').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;try{if(action==='history'){const history=await api('/receipts/'+id+'/history');alert(history.map(x=>new Date(x.at).toLocaleString('tr-TR')+' — '+x.actor+' — '+x.action+(x.reason?' ('+x.reason+')':'')).join('\n')||'İşlem geçmişi yok');return}let body;if(action==='cancel'){const reason=prompt('İptal nedeni (zorunlu):');if(!reason)return;body=JSON.stringify({reason})}else if(!confirm('Bu işlemi onaylıyor musunuz?'))return;await api('/receipts/'+id+'/'+action,{method:'POST',...(body?{body}:{})});notice('İşlem tamamlandı');await refresh()}catch(e){notice(e.message)}};
$('receiptDate').value=new Date().toLocaleDateString('en-CA');init();
</script></body></html>
